<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Si ya hay sesión iniciada, registro.js manda directo al sitio -->
  <script src="/js/config.js"></script>
  <script src="/js/sesion.js"></script>
  <title>Crear cuenta | Smart Car Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body data-seccion="login">
  <div class="fondo"></div>
  <div class="fondo-oscuro"></div>

  <main class="login">

    <!-- ================= TÍTULO E IMAGEN DEL ROBOT ================= -->
    <section class="presentacion-login">
      <div class="banner-titulo">
        <h1 class="titulo-login">Smart Car Explorer</h1>
        <p class="subtitulo-login">Robot autónomo con ESP32, LoRa y GPS</p>
      </div>

      <div class="tarjeta-robot">
        <svg class="ilustracion-robot" viewBox="0 0 420 300" role="img" aria-label="Ilustración de un carro robot">
          <ellipse cx="210" cy="254" rx="165" ry="12" class="sombra"/>
          <rect x="268" y="52" width="6" height="66" rx="3" class="antena"/>
          <circle cx="271" cy="50" r="8" class="antena-punta"/>
          <rect x="130" y="96" width="56" height="22" rx="4" class="gps"/>
          <rect x="140" y="102" width="36" height="10" rx="2" class="gps-chip"/>
          <rect x="70" y="116" width="270" height="18" rx="9" class="placa-sup"/>
          <rect x="96" y="134" width="8" height="34" class="poste"/>
          <rect x="306" y="134" width="8" height="34" class="poste"/>
          <rect x="140" y="140" width="110" height="24" rx="3" class="tarjeta"/>
          <rect x="186" y="145" width="26" height="14" rx="2" class="chip"/>
          <rect x="50" y="166" width="310" height="30" rx="12" class="placa-inf"/>
          <rect x="350" y="150" width="22" height="58" rx="4" class="sensor"/>
          <circle cx="372" cy="166" r="11" class="sensor-ojo"/>
          <circle cx="372" cy="192" r="11" class="sensor-ojo"/>
          <circle cx="112" cy="214" r="38" class="llanta"/>
          <circle cx="112" cy="214" r="18" class="rin"/>
          <circle cx="300" cy="214" r="38" class="llanta"/>
          <circle cx="300" cy="214" r="18" class="rin"/>
          <path d="M290 34 a26 26 0 0 1 0 32" class="senal"/>
          <path d="M300 24 a40 40 0 0 1 0 52" class="senal"/>
        </svg>
      </div>
    </section>

    <!-- ================= FORMULARIO DE REGISTRO ================= -->
    <section class="tarjeta-login">
      <div class="login-encabezado">
        <span class="login-icono">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="8.5" cy="7" r="4"/>
            <line x1="20" y1="8" x2="20" y2="14"/>
            <line x1="23" y1="11" x2="17" y2="11"/>
          </svg>
        </span>
        <h2>Crear cuenta</h2>
        <p>Regístrate para acceder al monitoreo y control del robot.</p>
      </div>

      <form id="formRegistro" novalidate>
        <label class="campo">
          <span>Usuario</span>
          <div class="entrada">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>
            </svg>
            <input type="text" id="usuario" name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Elige un nombre de usuario" required>
          </div>
        </label>

        <label class="campo">
          <span>Correo electrónico</span>
          <div class="entrada">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            <input type="email" id="correo" name="correo" autocomplete="email" autocapitalize="none" spellcheck="false" placeholder="correo@ejemplo.com" required>
          </div>
        </label>

        <label class="campo">
          <span>Contraseña</span>
          <div class="entrada">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
            <input type="password" id="contrasena" name="contrasena" autocomplete="new-password" placeholder="Mínimo 8 caracteres" required>
            <button type="button" class="btn-ver" id="btnVer" aria-label="Mostrar contraseña" title="Mostrar contraseña">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <small class="aviso-mayus" id="avisoMayus" hidden>Bloq Mayús está activado</small>
        </label>

        <label class="campo">
          <span>Confirmar contraseña</span>
          <div class="entrada">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>
            </svg>
            <input type="password" id="confirmarContrasena" name="confirmarContrasena" autocomplete="new-password" placeholder="Repite tu contraseña" required>
            <button type="button" class="btn-ver" id="btnVerConfirmar" aria-label="Mostrar contraseña" title="Mostrar contraseña">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
          <small class="aviso-mayus" id="avisoMayusConfirmar" hidden>Bloq Mayús está activado</small>
        </label>

        <div class="error-login" id="errorRegistro" role="alert" hidden></div>

        <button type="submit" class="btn-ingresar" id="btnRegistrar">
          <span class="giro-boton" aria-hidden="true"></span>
          <span class="texto-boton">Registrarse</span>
        </button>

        <p style="text-align: center; margin-top: 1.25rem; font-size: 0.9rem; color: #a0a0a0;">
          ¿Ya tienes una cuenta?
          <a href="/login" style="color: var(--acento, #e8792f); font-weight: 600; text-decoration: none;">Inicia sesión</a>
        </p>
      </form>

    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.14.5/sweetalert2.all.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/registro.js"></script>
</body>
</html>
